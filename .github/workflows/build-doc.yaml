name: build-doc
on: push

jobs:
  build-doc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        path: ddynamic_reconfigure2

    - name: Install dependencies
      run: |
        sudo apt install vcstool graphviz doxygen python3-doxypypy

    - name: Build documents of ddynamic_reconfigure2
      run: |
        cd ./ddynamic_reconfigure2
        doxygen

    - name: Upload artifact of ddynamic_reconfigure2
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./ddynamic_reconfigure2/docs/html

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

permissions:
  contents: write
  pages: write
  id-token: write
